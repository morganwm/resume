name: Build Resume

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

env:
  # Keep in sync with the image tag in .devcontainer/devcontainer.json
  TYPST_VERSION: 0.15.1
  TYPSTYLE_VERSION: 0.15.2
  # Fonts are committed under fonts/ so every build uses the same files
  TYPST_FONT_PATHS: fonts

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install typstyle
        run: |
          curl -sSL --fail --retry 3 -o /usr/local/bin/typstyle \
            "https://github.com/typstyle-rs/typstyle/releases/download/v${TYPSTYLE_VERSION}/typstyle-x86_64-unknown-linux-gnu"
          chmod +x /usr/local/bin/typstyle

      - name: Check formatting
        run: typstyle --check .

      - name: Check spelling
        uses: crate-ci/typos@v1.51.1

  # The list of variants comes from the overviews dictionary in
  # src/content.typ, so adding a key there is all it takes to build it.
  variants:
    runs-on: ubuntu-latest
    outputs:
      companies: ${{ steps.list.outputs.companies }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ env.TYPST_VERSION }}

      - name: List company variants
        id: list
        run: |
          companies=$(typst eval 'import "src/content.typ": overviews; overviews.keys()')
          echo "companies=$companies" >> "$GITHUB_OUTPUT"
          echo "Variants: $companies"

  build:
    runs-on: ubuntu-latest
    needs: variants
    permissions:
      contents: write # upload release assets

    strategy:
      matrix:
        company: ${{ fromJSON(needs.variants.outputs.companies) }}

    env:
      FILE_BASE: morgan_watson-morris_resume

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ env.TYPST_VERSION }}

      - name: Compile resume
        env:
          COMPANY: ${{ matrix.company }}
          RESUME_PHONE: ${{ secrets.RESUME_PHONE }}
        run: |
          if [ "$COMPANY" = "base" ]; then
            PDF="${FILE_BASE}.pdf"
          else
            PDF="${FILE_BASE}_${COMPANY}.pdf"
          fi
          echo "PDF=$PDF" >> "$GITHUB_ENV"

          typst compile resume.typ "$PDF" \
            --input company="$COMPANY" \
            --input phone="$RESUME_PHONE" \
            2> typst-stderr.log || { cat typst-stderr.log >&2; exit 1; }
          cat typst-stderr.log >&2

          # Typst only warns about a missing font and silently falls back,
          # which changes the layout; treat that as a failure.
          if grep -q "unknown font family" typst-stderr.log; then
            echo "::error::Font missing; the PDF would use a fallback font"
            exit 1
          fi

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: resume-pdf-${{ matrix.company }}
          path: ${{ env.PDF }}
          retention-days: 30

      - name: Attach to Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "$PDF" --clobber --repo "$GITHUB_REPOSITORY"
